[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://aldora-sales-hub.netlify.app"
    Referrer-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
